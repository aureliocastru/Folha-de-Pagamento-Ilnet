<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` deixa a página chegar às beiradas do aparelho, e é
      o que faz o `env(safe-area-inset-*)` do CSS devolver a altura de verdade
      da barrinha do gesto no iPhone. Sem ele o valor é sempre zero, e a barra
      de navegação do celular ficaria por baixo dela.

      O zoom de pinça vai dito às claras (`user-scalable=yes`, até 5x): quem
      lê um MAC ou um número de série miúdo no celular precisa ampliar, e o
      app instalado na tela de início não deve depender do padrão do iOS.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A1020" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      Instalado na tela de início, o app abre **sem navegador**: sem barra de
      endereço em cima e sem a barra de voltar/compartilhar embaixo. São
      dezenas de pixels de altura recuperados numa tela de bolso, e o motivo
      de o `manifest` existir — não há como uma página esconder essas barras
      por conta própria, elas são do navegador e não dela.

      O `manifest` resolve o Android (Chrome oferece "Instalar app"). O iPhone
      não lê `display: standalone` do manifesto: ele precisa das três metas
      `apple-` abaixo, e a instalação é sempre manual — Compartilhar →
      "Adicionar à Tela de Início", e **pelo Safari**, porque o navegador
      embutido do WhatsApp não tem essa opção.

      `status-bar-style: default` de propósito: com `black-translucent` a
      página passaria por baixo do relógio e o iOS escreveria a hora em
      branco — invisível sobre o cabeçalho branco do tema claro.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ILNET" />
    <link rel="apple-touch-icon" href="/icone-180.png" />

    <title>ILNET TELECOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk (títulos e números grandes) + IBM Plex Sans (interface e
         tabelas). Se as fontes não carregarem, a pilha do sistema assume. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      O tema é decidido antes de qualquer pintura. Se esperasse o React, quem
      escolheu o escuro veria a tela branca piscar a cada carregamento — e
      quem trabalha aqui de madrugada veria isso o tempo todo.
    -->
    <script>
      (function () {
        try {
          var escolha = localStorage.getItem('ilnet:tema');
          var escuro =
            escolha === 'escuro' ||
            (escolha !== 'claro' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) {
            document.documentElement.classList.add('dark');
            // A barra do navegador no celular nasce com a cor do tema, e não
            // só depois que alguém clica no botão.
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0F1626');
          }
        } catch (e) {
          /* localStorage bloqueado: fica no tema claro, que é o padrão. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
